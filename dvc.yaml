stages:
  preprocess:
    cmd: python src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
    params:
      - train.img_height
      - train.img_width
      - train.test_size
      - train.random_state
      - train.num_classes
      - train.max_samples
    outs:
      - data/raw
      - data/processed

  augment:
    cmd: python src/data_augmentation.py
    deps:
      - src/data_augmentation.py
      - data/raw
    params:
      - train.test_size
      - train.random_state
    outs:
      - data/augmented

  train:
    cmd: python src/train_models.py
    deps:
      - src/train_models.py
      - data/processed
    params:
      - train
    outs:
      - models/base
    metrics:
      - metrics.json:
          cache: false

  train_aug:
    cmd: python src/train_models_augmented.py
    deps:
      - src/train_models_augmented.py
      - data/augmented
    params:
      - train
    outs:
      - models/augmented
    metrics:
      - metrics_aug.json:
          cache: false
